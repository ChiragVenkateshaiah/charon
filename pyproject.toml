[project]
name = "charon"
version = "0.1.0"
description = "Self-service GPU inference platform — model deployment, optimization, safe rollout, and cost-per-token measurement."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Chirag", email = "chiragvenkateshaiah95@gmail.com" },
]
# Dependencies are deliberately empty. Each phase adds what it needs when the
# corresponding implementation decision is made (see CLAUDE.md — no tooling
# additions ahead of a decision).
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
